name: build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build --stacktrace
      - name: Dedicated server startup smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f server-smoke.log

          set +e
          gradle runServer --args nogui > server-smoke.log 2>&1 &
          SERVER_PID=$!
          set -e

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for _ in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' server-smoke.log; then
              cat server-smoke.log
              exit 0
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Server exited before reaching ready state.'
              cat server-smoke.log
              exit 1
            fi

            sleep 1
          done

          echo 'Timed out waiting for dedicated server ready state.'
          cat server-smoke.log
          exit 1
      - name: Upload server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: custom-pickaxe
          path: build/libs/*.jar
